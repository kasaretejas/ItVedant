<html>
    <head>
        <title>Layouting Tags</title>
    </head>
    <body>
        <!-- semnatic tags/elements : the tags that convey meaning  ex h1, p, u, ol  -->
        <!-- non-semantic tags/elements : tags that does not have direct meaning ex div  -->
        <!-- div tag : it is container , occupy complete width  -->
        <div>
            <h1>My Name is Tejas</h1>
            <p>Address : Thane</p>
        </div>
        <div>
            <a href="">click me</a>
        </div>

        <!-- header : to display heading part of website  -->
        <header>
            <h1>BiteBox</h1>
            <p>Best website for online food delivery</p>
        </header>

        <!-- footer : to display end of website  -->
        <footer>
            <p>@Copyright reserved 2026 Bitebox</p>
        </footer>

        <!-- main : the things that we have to display below navbar - like slider, video, -->
        <main>
            <h1>this is main content</h1>
        </main>

        <!-- nav : to create navbar  -->
        <nav>
            <a href="">Products</a> |
            <a href="">Reviews</a> |
            <a href="">Contact Us</a>
        </nav>

        <!-- section : for specific section in website : reviews, hiring partner  -->
        <section>
            <h1>This is our section</h1>
            <p>for reviews</p>
        </section>

        <!-- article : to add blog isnide website  -->
        <article>
            <h1>How to come up procastination</h1>
        </article>

        <!-- aside : for side bar -->
        <aside>
            <p>to create verical navbar or sidebar</p>
        </aside>
    </body>
</html>
