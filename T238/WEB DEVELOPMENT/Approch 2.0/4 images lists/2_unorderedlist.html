<html>
    <head>
        <title>Un Ordered List</title>
    </head>
    <body>
        <h1>Fruits</h1>
        <ul>
            <li>Mango</li>
            <li>Banana</li>
            <li>Apple</li>
        </ul>

        <ul type="square">
            <li>Mango</li>
            <li>Banana</li>
            <li>Apple</li>
        </ul>

        <ul type="circle">
            <li>Mango</li>
            <li>Banana</li>
            <li>Apple</li>
        </ul>

        <ul type="disk">
            <li>Mango</li>
            <li>Banana</li>
            <li>Apple</li>
        </ul>
    </body>
</html>
