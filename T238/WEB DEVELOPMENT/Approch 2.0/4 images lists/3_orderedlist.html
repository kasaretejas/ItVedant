<html>
    <head>
        <title>Ordered List</title>
    </head>
    <body>
        <h1>Fruits</h1>
        <ol>
            <li>Banana</li>
            <li>Grapes</li>
        </ol>

        <ol type="1">
            <li>Banana</li>
            <li>Grapes</li>
        </ol>

        <ol type="A">
            <li>Banana</li>
            <li>Grapes</li>
        </ol>

        <ol type="a">
            <li>Banana</li>
            <li>Grapes</li>
        </ol>

        <ol type="i">
            <li>Banana</li>
            <li>Grapes</li>
        </ol>

        <ol type="I">
            <li>Banana</li>
            <li>Grapes</li>
        </ol>

        <ol type="1" start="5">
            <li>Banana</li>
            <li>Grapes</li>
        </ol>

        <ol type="A" start="6">
            <li>Banana</li>
            <li>Grapes</li>
        </ol>

        <ol type="i" start="10">
            <li>Banana</li>
            <li>Grapes</li>
        </ol>
    </body>
</html>
