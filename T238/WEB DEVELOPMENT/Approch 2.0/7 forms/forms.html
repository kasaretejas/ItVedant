<html>
    <head>
        <title>HTML Form</title>
    </head>
    <body>
        <form>
            <h1>Keybord input for form</h1>
            <label for="username">Your Name:</label>
            <input type="text" id="" name="username">
            <br> <br>
            <label for="age">Your Age:</label>
            <input type="number" id="age" name="age">
            <br> <br>
            <label for="email">Your Email:</label>
            <input type="email" id="email" name="email">
            <br> <br>
            <label for="password">Your Password:</label>
            <input type="password" id="password" name="password">
            <br> <br>
            <label for="phone">Your Phone:</label>
            <input type="tel" id="phone" name="phone">

            <h1>mouse input for form</h1>
            <br> <br>
            <label for="color">Your color:</label>
            <input type="color" id="color" name="color">
            <br> <br>

            <input type="checkbox" id="tnc" name="tnc">
            <label for="tnc">I agree terms and conditions</label>
            <br> <br> 

            <label for="dob">Your DOB:</label>
            <input type="date" id="dob" name="dob">
            <br> <br> 

            <label for="logintime">Your LogInTime:</label>
            <input type="time" id="logintime" name="logintime">
            <br> <br> 

            <label for="punchin">Your PunchIn:</label>
            <input type="datetime-local" id="punchin" name="punchin">
            <br> <br>  

            <label for="resume">Your Resume:</label>
            <input type="file" id="resume" name="resume">
            <br> <br>  


            <label for="gender" >Your Gender :</label>
            <input type="radio" value="m" name="gender" id="gender">Male
            <input type="radio" value="f" name="gender" id="gender">Female
            <br><br>

            <select name="country" id="country">
                <option value="">Open this to select country</option>
                <option value="in">India</option>
                <option value="usa">America</option>
                <option value="aus">Australia</option>
            </select>
            <br><br>

            <label for="address">Address</label>
            <textarea name="address" id="address" cols="50" rows="10"></textarea>
            <br><br>

            <input type="submit">
            <br><br>

            <input type="reset">
        </form>
    </body>
</html>
<!-- for and id used to connect label with input  -->
 <!-- name is used for mapping with table columns  -->
