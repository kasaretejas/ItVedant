<html>
    <head>
        <title>inline and internal css</title>
        <style>
            p{ color: blue;}
        </style>
    </head>
    <body>
        inline : inside tag, css applied inside tag is called as inline css 
        inside tag we have to use style attribute
        <h1 style="color: red;">this h1 is colored using inline css</h1>

        internal : inside head tag of an html 
        inside head tag, use style tag
        <p>this parahraph is colored using internal css</p>
        
    </body>
</html>
