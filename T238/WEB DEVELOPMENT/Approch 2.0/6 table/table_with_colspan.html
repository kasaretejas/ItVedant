<html>
    <head>
        <title>
            table with col span
        </title>
    </head>
    <body>
        <table border  cellspacing="0" cellpadding="10" align="center">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Name</th>
                    <th colspan="2">Phone</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>25</td>
                    <td>Dr. Amit</td>
                    <td>9894898376</td>
                    <td>8787788999</td>
                </tr>
                <tr>
                    <td>29</td>
                    <td>Dr. Raj</td>
                    <td colspan="2">9894898376</td> 
                </tr>
            </tbody>
        </table>
    </body>
</html>
