<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Text Formatting</title>
</head>
<body>
    
    <p>I live in nearby <b>Thane</b> railway station</p>

    <p>I live in nearby <u>Thane</u> railway station</p>

    <p>I live in nearby <i>Thane</i> railway station</p>

    <p>I live in nearby <mark>Thane</mark> railway station</p>

    <p>Today is 31<sup>st</sup> December</p>

    <p>Scintific formula of water is H<sub>2</sub>O</p>
