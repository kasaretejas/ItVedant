<html>
    <head>
        <title>ELEMENT USING JS</title>
    </head>
    <body>
        <div id="root"></div>

        <script>
            let root = document.getElementById("root")
            let myh1 = document.createElement("h1")
            myh1.textContent = "H1 using JS"
            root.appendChild(myh1)
        </script>
    </body>
    
</html>
