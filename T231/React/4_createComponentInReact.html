<html>
    <head>
        <title>COMPONENT IN REACT</title>
    </head>
    <body>
        <div id="root"></div>

        <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

        <script>
            let root = document.getElementById("root")

            function Display() //here Display is component and component name must be start with Capital
            {
                let myh1=React.createElement("h1",null, "h1 in REACT Component")
                return myh1;
            }

            let myRoot=ReactDOM.createRoot(root)
            myRoot.render(React.createElement(Display)) //rendering component
        </script>
    </body>
    
</html>
