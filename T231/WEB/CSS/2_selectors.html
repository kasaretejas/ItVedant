<html>
    <head>
        <title>Selectors</title>
        <link rel="stylesheet" href="2_selectors.css">
    </head>
    <body>
        <!-- tag selector  -->
        <h1>Hello HTML</h1>
        <h1>Hello CSS</h1>
        <h1>Hello JS</h1>

        <!-- id selector  -->
        <!-- when all tags are same, but required different style  -->
        <h1 id="inGreen">H1 in Green</h1>
        <h1 id="inBlue">H1 in blue</h1>


        <!-- class selector  -->
        <!-- when tags are different, but required same style  -->
        <h1 class="inOrange">h1 in orange</h1>
        <h2 class="inOrange">h2 in orange</h2>
        <h3 class="inOrange">h3 in orange</h3>


        <!-- group selector  : check in css -->

        <!-- child selectors - direct, indirect, adjecent, general -->
        <div>  <!--parent tag-->
            <h4>Direct Child : red</h4>
            <section>
                <h4>direct child of section, indirect child of div : green</h4>
            </section>
            <h4>Direct Child : red</h4>
        </div>
        <h4>Adjcent Child : blue</h4>
        <h4>General Child : bg-color-yellow</h4>






    </body>
</html>
