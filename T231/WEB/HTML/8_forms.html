<html>
    <head>
        <title>Form</title>
    </head>
    <body>
        <form>
            <h1>Keybord inputs</h1>
            <label for="username">Name :</label>
            <input type="text" id="username" name="username"> <br> <br>

            <label for="phone">Phone :</label>
            <input type="number" id="phone" name="phone"> <br> <br>

            <label for="password">Password :</label>
            <input type="password" id="password" name="password"> <br> <br>

            <label for="email">Email :</label>
            <input type="email" id="email" name="email"> <br> <br>

            <h1>Mouse inputs</h1>

            <label for="dob">DOB :</label>
            <input type="date" id="dob" name="dob"> <br> <br>

            <label for="time">Log in Time :</label>
            <input type="time" id="time" name="time"> <br> <br>

            <label for="punchin">Punch in :</label>
            <input type="datetime-local" id="punchin" name="punchin"> <br> <br>

            
            <input type="checkbox" id="agreement" name="agreement"> 
            <label for="agreement" >I Agree Terms</label><br> <br>

            <label for="gender">Gender</label>
            <input type="radio" for="gender" name="gender" value="m">Male
            <input type="radio" for="gender" name="gender" value="f">Female <br> <br>

            <label for="course">Course:</label>
            <select name="course" id="course">
                <option value="java">Java Full Stack</option>
                <option value="python">Python Full Stack</option>
                <option value="ds">Data Science</option>
            </select><br> <br>

            <input type="submit">
        </form>
    </body>
</html>
