<html>
    <head>
        <title>Types of elements</title>
    </head>
    <body>
        <!-- complete element  -->
        <p>Hello HTML</p>

        <!-- void element  -->
        <hr>

        <!-- block element  -->
        <h1>I will occupy complete width</h1>
        <h1>I will go on next line</h1>

        <!-- inline element  -->
        <span>I will occupy required width</span>
        <span>this text will display on same line</span>
    </body>
</html>
