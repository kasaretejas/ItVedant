<html>
    <head>
        <title>Text Formatting Tags</title>
    </head>
    <body>
        <!-- all text formatting tags are inline tags -->
         <p>Hello I am <b>Tejas</b> </p>
         <p>Hello I am <i>Tejas</i> </p>
         <p>Hello I am <u>Tejas</u> </p>
         <p>Hello I am <mark>Tejas</mark> </p>
         <p>Hello I am <del>Tejas</del> </p>
         <p>Hello I am <mark><i><u>Tejas</u></i></mark> </p>

         <marquee> Result declared</marquee>

         <h3>H<sub>2</sub>0</h3>
         <h3>4<sup>2</sup>=16</h3>
    </body>
</html>
