<html>
    <head>
        <title>Currency Convertor</title>
        <script src="8_currency_convertor.js" defer></script>
    </head>
    <body>
        <div>
            <h3>Select Currency From</h3>
            <select id="fromCurrency"></select>

            <h3>Enter amount to convert</h3>
            <input type="number" id="inputAmount" placeholder="amount" value="0">

            <h3 >Select Currency To</h3>
            <select id="toCurrency"></select>

            <br><br>
            <button id="btn">Click to Convert</button>
            <br><br>

            <input type="number" id="convertedAmount"  disabled value="0">
        </div>
    </body>
</html>
