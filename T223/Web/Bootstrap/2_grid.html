<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="2_grid.css">
</head>
  <body>
    <div class="container-fluid bg-primary text-center p-5">
        <h1 class="text-light">I am container-fluid</h1>
    </div>

    <div class="container bg-warning mt-5">
        <h1>I am container</h1>
    </div>

    <div class="container">
        <div class="row div-height">  <!-- div-height code in our css-->
            <div class="col-4 bg-primary"></div>
            <div class="col-4 div-bg-orange"></div> <!-- div-bg-orange code in our css-->
            <div class="col-4 bg-info"></div>
        </div>
    </div>

    <div class="container mt-5">
        <div class="row div-height">  <!-- div-height code in our css-->
            <div class="col-2 bg-primary"></div>
            <div class="col-8 div-bg-orange"></div> <!-- div-bg-orange code in our css-->
            <div class="col-2 bg-info"></div>
        </div>
    </div>

    <div class="container mt-5">
        <div class="row div-height">  <!-- div-height code in our css-->
            <div class="col-8 bg-primary"></div>
            <div class="col-4 div-bg-orange"></div> <!-- div-bg-orange code in our css-->
            <div class="col-3 bg-info"></div>
        </div>
    </div>

    <!-- responsive grid  -->
     <div class="container mt-5">
        <div class="row div-height">  <!-- div-height code in our css-->
            <div class="col-lg-3 col-md-6 col-sm-12 bg-primary"></div>
            <div class="col-lg-3 col-md-6 col-sm-12 div-bg-orange"></div> <!-- div-bg-orange code in our css-->
            <div class="col-lg-3 col-md-6 col-sm-12 bg-info"></div>
            <div class="col-lg-3 col-md-6 col-sm-12 bg-success"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
