<html>
    <head>
        <title>TAG, ID, CLASS, GROUP</title>
        <link rel="stylesheet" href="1-style.css">
    </head>
    <body>
        <!-- tag selector : same style for all h1 in whole document/page -->
        <h1>Hello CSS in green</h1>
        <h1>Hello CSS in green</h1>

        <!-- id selector : same tag, different style  -->
        <h1 id="h1_blue">Hello CSS in blue</h1>
        <h1 id="h1_orange">Hello CSS in orange</h1>

        <!-- class selector : different tag,  same style  -->
        <p class="in_red">Hello in Red</p>
        <h2 class="in_red">Hello in Red</h2>
        <h3 class="in_red">Hello in Red</h3>
    </body>
</html>
