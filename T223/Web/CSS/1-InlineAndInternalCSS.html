<html>
    <head>
        <title>Inline and Internal CSS</title>
        <style>
            h2
            {
                color: green;
            }
        </style>
    </head>
    <body>
        <!-- inline css example  -->
        <h1 style="color: red;">Hello in Red color inline css</h1>

        <!-- internal css  -->
        <h2>Hello in green color using internal css</h2>
    </body>
</html>
