<html>
    <head>
        <title>Audio Video IFRAME</title>
    </head>
    <body>
        <!-- <audio src="audio.mp3" controls autoplay></audio> -->
         <audio controls autoplay muted>
            <source src="audio.mp3" type="audio/mp3">
         </audio>

         <!-- <video src="video.mp4" controls autoplay></video> -->
         <video controls autoplay loop height="400" width="400">
            <source src="video.mp4" type="video/mp4">
         </video>

         <iframe width="560" height="315" src="https://www.youtube.com/embed/bpUMOVDmh1s?si=-tLRuY_-1BqvmqLx" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
         <iframe width="560" height="315" src="https://www.youtube.com/embed/iwerXyMCYZM?si=AsN7gljuL-zIz7Fr" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </body>
</html>
