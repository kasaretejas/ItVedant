<html>
    <head>
        <title>Image and Anchor</title>
    </head>
    <body>
        <!-- go to google -> rose 200x200 -> images -> click on image -> 
        you will get preview -> hover on it and check size -> right click and 
        open image in new tab -> go to new tab -> right click on image -> save image as  -->
        
        <!-- showing downloaded image  -->
        <img src="rose.jpg" alt="rose image">
        <!-- showing message if image is absent  -->
        <img src="rosee.jpg" alt="rose image">
        <!-- showing larg image  -->
        <img src="pinkRose.jpg" alt="pink rose">
        <!-- showing image after changing size  -->
        <img src="pinkRose.jpg" alt="pink rose" width="200" height="200">
        <!-- showing internet image  -->
        <img src="https://atlas-content-cdn.pixelsquid.com/assets_v2/326/3260534802754835825/previews/G03-200x200.jpg" alt="internet image">
    
        <br><br>

        <!-- anchor tag  -->
        <a href="https://www.facebook.com/">
            click here to open Facebook
        </a>
        <br>
        <a href="https://www.facebook.com/" target="_blank">
            click here to open Facebook in new tab
        </a>
        <br>
        <a href="https://www.facebook.com/" target="_blank">
            <img src="facebook.jpg" alt="" height="50" width="50">
        </a>
    </body>
    </body>
</html>
