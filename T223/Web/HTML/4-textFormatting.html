<!-- semantic elements : 
    the tag who has meaning
    developer and browser both understand what is going to be displayed
    ex : h1, p, img, section, footer 

non semantic :
    the tag who has no meaning
    browser treat it as look wise
    ex : div : understands to occupy entire width
         span: understands to occupy required width,  -->

<html>
    <head>
        <title>Text Formatting</title>
    </head>
    <body>
        <p>simple paragraph</p>

        <p><b>bold paragraph</b></p>
        <p><strong>bold paragraph</strong></p>

        <p><i>italic  paragraph</i></p>
        <p><em>italic  paragraph</em></p>

        <p><u>underline paragraph</u></p>
        
        <p><del>deleted paragraph</del></p>

        <p>H<sub>2</sub>O</p>

        <p>4<sup>2</sup>=16</p>

        <p><mark>This is highlighted</mark></p>

        <p><marquee>10th class result</marquee></p>

        <p><q>quoted , text</q></p>
        <p><code>int x=10;</code></p>
        <p><abbr title="HTML is used for structure">HTML</abbr> </p>
    </body>

</html>
